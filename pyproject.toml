[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harvey-local-ai-sales-agent"
version = "0.1.0"
description = "Local-first, multi-product AI sales-agent foundation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["harvey", "local-inference", "sales-agent", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.5,<3",
    "psutil>=5.9,<8",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[project.urls]
Homepage = "https://github.com/code4wealth/harvey-local-ai-sales-agent"

[tool.setuptools.packages.find]
include = ["app*"]
