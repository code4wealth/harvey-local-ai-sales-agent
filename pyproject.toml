[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harvey-local-ai-sales-agent"
version = "0.1.0"
description = "Fully local, zero-LLM-cost, multi-product AI sales agent (Ollama + Qwen3). Fork of ethanplusai/harvey."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
keywords = ["sales", "outreach", "ai-agent", "local-first", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
# Keep in sync with requirements.txt.
# Licences: fastapi (MIT), starlette (BSD-3), uvicorn (BSD-3), httpx (BSD-3),
# pydantic (MIT), sentence-transformers (Apache-2.0), beautifulsoup4 (MIT).
# Full licence table: docs/MODELS_AND_LICENCES.md.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.27.0,<1",
    "pydantic>=2.5,<3",
    "sentence-transformers>=2.7,<4",
    "beautifulsoup4>=4.12.3,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[project.urls]
Upstream = "https://github.com/ethanplusai/harvey"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
